# Isolated local qualification only. Never a production ERP deployment.
# Use backend-ts/scripts/erpbridge-docker-qa.mjs; it supplies disposable credentials.
services:
  mock-erp:
    image: ghcr.io/nmdra/mockerp:0.2.1
    ports: ["127.0.0.1:18081:8081"]
    environment:
      LOG_LEVEL: warn
      MOCK_ERP_DB_PATH: /data/mockerp.db
      MOCK_ERP_CREDENTIALS_JSON: ${LCWE_QA_MOCK_CREDENTIALS:?launcher required}
    volumes: ["mockerp-data:/data"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis/redis-stack:7.2.0-v9
    # No host Redis or RedisInsight port; available only within this project.
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  erpbridge-server:
    build:
      context: ../../../ERPBridge
      # Inline avoids requiring Bake filesystem entitlements outside the
      # upstream source context. No file is generated inside ERPBridge.
      dockerfile_inline: |
        FROM golang:1.26.2-alpine AS builder
        WORKDIR /src
        ENV GOMAXPROCS=2 CGO_ENABLED=0
        COPY go.mod go.sum ./
        RUN --mount=type=cache,target=/go/pkg/mod go mod download
        COPY . .
        RUN --mount=type=cache,target=/go/pkg/mod --mount=type=cache,target=/root/.cache/go-build go build -mod=readonly -p=2 -o /erpbridge-server ./services/erpbridge-server
        FROM alpine:3.23
        RUN apk add --no-cache ca-certificates
        WORKDIR /app
        COPY --from=builder /erpbridge-server /app/erpbridge-server
        EXPOSE 8080
        CMD ["/app/erpbridge-server"]
    ports: ["127.0.0.1:18080:8080"]
    environment:
      BASE_URL: http://127.0.0.1:18080
      ERP_BASE_URL: http://mock-erp:8081
      REDIS_URL: redis://redis:6379
      DATABASE_PATH: /app/data/erpbridge.db
      API_AUTH_TOKEN: ${LCWE_QA_BRIDGE_TOKEN:?launcher required}
      ERP_PRIMARY_KEY: ${LCWE_QA_ERP_PRIMARY_KEY:?launcher required}
      MCP_ENABLE_TEST_TOOLS: "false"
      INSECURE_AUTH_ALLOWED_HOSTS: mock-erp:8081
      RATE_LIMIT_RPS: "10"
      RATE_LIMIT_BURST: "20"
    volumes: ["erpbridge-data:/app/data"]
    depends_on:
      mock-erp: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/mcp/health"]
      interval: 5s
      timeout: 5s
      retries: 18
volumes:
  mockerp-data:
  redis-data:
  erpbridge-data:
