version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  Qdrant vector database — start this when the other developer's instance
#  becomes accessible, then switch RETRIEVER=qdrant in .env
# ─────────────────────────────────────────────────────────────────────────────
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    restart: unless-stopped

volumes:
  qdrant_data:
